name: Android build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      fetch_backgrounds:
        description: "جلب خلفيات الطبيعة المرخّصة من ويكيميديا كومنز وكتابتها في الفرع قبل البناء"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # يعمل فقط عند التشغيل اليدوي مع fetch_backgrounds = true.
  # يشغّل scripts/fetch-backgrounds.js (له وصول للشبكة على GitHub) ثم يكتب الناتج كـ commit في نفس الفرع.
  fetch-backgrounds:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.fetch_backgrounds }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1

      - name: Fetch licensed nature backgrounds
        run: node scripts/fetch-backgrounds.js

      - name: Run tests
        run: node --test tests/*.test.js

      - name: Commit and push the new backgrounds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/www/backgrounds
          if git diff --cached --quiet; then
            echo "لا تغييرات في الخلفيات."
            exit 0
          fi
          git commit -m "Add licensed nature backgrounds from Wikimedia Commons" \
            -m "Generated by scripts/fetch-backgrounds.js. Only CC0, public domain and CC BY files; see backgrounds/LICENSES.md." \
            -m "Co-Authored-By: Claude Haiku 5.5 <noreply@anthropic.com>" \
            -m "Claude-Session: https://claude.ai/code/session_01JXhogiCdqciDpUmajFMCYA"
          git push origin "HEAD:${GITHUB_REF_NAME}"

  build:
    needs: fetch-backgrounds
    # ينتظر الجلب (إن وُجد) ثم يبني من أحدث الفرع، ولا يتوقف إذا كان الجلب مُتخطّى
    if: ${{ always() && (needs.fetch-backgrounds.result == 'success' || needs.fetch-backgrounds.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # نقرأ الفرع بعد أن كتب الجلب commit جديداً؛ GITHUB_SHA يبقى على الـ commit الذي بدأ منه التشغيل
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.fetch-backgrounds.result == 'success' && github.ref || github.sha }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # يثبّت Gradle 8.10.2 ويكاش الملفات، وما نحتاج gradlew لأن المشروع بدون wrapper حالياً
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: inaba-quran-clips-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
