name: Fetch backgrounds

# يدوي فقط: يجلب خلفيات طبيعة مرخّصة من ويكيميديا كومنز ويحدّث المكتبة في الفرع الحالي.
# يشغّل نفس السكربت المحلي scripts/fetch-backgrounds.js، ثم الاختبارات، ثم يكتب الناتج كـ commit.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1

      - name: Fetch licensed nature backgrounds
        run: node scripts/fetch-backgrounds.js

      - name: Run tests
        run: node --test tests/*.test.js

      - name: Commit and push the new backgrounds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/www/backgrounds
          if git diff --cached --quiet; then
            echo "لا تغييرات في الخلفيات."
            exit 0
          fi
          git commit -m "Add licensed nature backgrounds from Wikimedia Commons" \
            -m "Generated by scripts/fetch-backgrounds.js. Only CC0, public domain and CC BY files; see backgrounds/LICENSES.md." \
            -m "Co-Authored-By: Claude Haiku 5.5 <noreply@anthropic.com>" \
            -m "Claude-Session: https://claude.ai/code/session_01JXhogiCdqciDpUmajFMCYA"
          git push origin "HEAD:${GITHUB_REF_NAME}"
